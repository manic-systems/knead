bench   = [ { harness = false, name = "parse" }, { harness = false, name = "decode" } ]
example = [ { name = "config" } ]

[workspace]
members  = [ "knead-derive" ]
exclude  = [ "fuzz" ]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97.1"
authors      = [ "Amaan Qureshi <contact@amaanq.com>" ]
license      = "EUPL-1.2"
repository   = "https://github.com/amaanq/knead"
homepage     = "https://github.com/amaanq/knead"
keywords     = [ "kdl", "parser", "config", "serialization" ]
categories   = [ "parser-implementations", "config", "encoding" ]

[package]
name                   = "knead"
description            = "A KDL parser and typed decoder"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
include                = [ "src", "examples", "README.md", "LICENSE" ]

[features]
miette = [ "dep:miette" ]

[dependencies]
miette = { default-features = false, optional = true, version = "7.6.0" }

[dev-dependencies]
criterion    = { default-features = false, version = "0.8.2" }
knead-derive = { path = "knead-derive", version = "0.1.0" }

[lints]
workspace = true

[workspace.lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction                      = { level = "warn", priority = -1 }

arbitrary_source_item_ordering  = "allow"
arithmetic_side_effects         = "allow"
else_if_without_else            = "allow"
error_impl_error                = "allow"
exhaustive_enums                = "allow"
exhaustive_structs              = "allow"
implicit_return                 = "allow"
indexing_slicing                = "allow"
integer_division                = "allow"
integer_division_remainder_used = "allow"
missing_trait_methods           = "allow"
module_name_repetitions         = "allow"
question_mark_used              = "allow"
ref_patterns                    = "allow"
separated_literal_suffix        = "allow"
single_call_fn                  = "allow"
std_instead_of_alloc            = "allow"
std_instead_of_core             = "allow"
tests_outside_test_module       = "allow"
